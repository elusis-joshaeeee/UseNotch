name: Build CreditNotch App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-mac:
    runs-on: macos-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Build macOS app
      run: npm run build-mac
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: CreditNotch-macOS
        path: |
          dist/*.dmg
          dist/*.zip
